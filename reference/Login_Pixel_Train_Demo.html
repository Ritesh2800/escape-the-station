<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Login Pixel Train Demo</title>
<style>
  :root { --bg:#f3f4f6; --card:#fff; --text:#111827; --muted:#374151; --line:#d1d5db; --accent:#2563eb; --accent-h:#1d4ed8; --game:#0b1026; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#111827; --card:#1f2937; --text:#f9fafb; --muted:#d1d5db; --line:#4b5563; }
  }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--text); overflow:hidden; display:flex; align-items:center; justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; user-select:none; }
  .card { width:100%; max-width:360px; margin:0 16px; box-sizing:border-box; background:var(--card); border:1px solid var(--line); border-radius:6px; padding:32px; box-shadow:0 1px 2px rgba(0,0,0,.06); }
  h2 { margin:0 0 24px; text-align:center; font-size:20px; font-weight:600; }
  form { display:flex; flex-direction:column; gap:16px; }
  label { display:block; font-size:12px; font-weight:500; color:var(--muted); margin-bottom:6px; }
  input { width:100%; height:40px; box-sizing:border-box; padding:8px 12px; font-size:14px; color:var(--text); background:var(--card); border:1px solid var(--line); border-radius:4px; outline:none; }
  input:focus { border-color:var(--accent); }
  button.login { height:40px; font-size:14px; font-weight:500; color:#fff; background:var(--accent); border:0; border-radius:4px; cursor:pointer; transition:background .2s; }
  button.login:hover { background:var(--accent-h); }

  #game { position:fixed; inset:0; background:var(--game); z-index:50; display:none; flex-direction:column; align-items:center; justify-content:center; gap:20px; clip-path:inset(100% 0 0 0); }
  #game.on { display:flex; }
  .title { display:flex; gap:.04em; font-size:clamp(40px,10vw,96px); font-weight:800; letter-spacing:.08em; color:#fff; text-shadow:0 0 25px rgba(255,255,255,.25); }
  .title span { display:inline-block; opacity:0; }
  .title span.sp { width:.35em; }
  .title.go span { animation: drop .9s cubic-bezier(.3,.7,.4,1) forwards, wave 1.1s ease-in-out infinite; animation-delay: calc(var(--i) * 70ms), calc(.9s + var(--i) * 90ms); }
  @keyframes drop {
    0% { transform:translateY(-70vh) scaleY(1.3); opacity:0; }
    30% { opacity:1; }
    55% { transform:translateY(0) scale(1.25,.7); }
    72% { transform:translateY(-60px) scale(.9,1.1); }
    86% { transform:translateY(0) scale(1.1,.9); }
    100% { transform:translateY(0) scale(1); opacity:1; }
  }
  @keyframes wave { 0%,100% { transform:translateY(0); opacity:1; } 40% { transform:translateY(-28px); opacity:1; } 60% { transform:translateY(0) scale(1.08,.92); opacity:1; } }
  .hint { font-size:14px; color:#94a3b8; margin:0; opacity:0; transition:opacity .5s .9s; }
  #game.show .hint { opacity:1; }
  kbd { padding:2px 8px; font-size:12px; font-weight:600; color:#e2e8f0; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); border-radius:4px; }
  #closeBtn { background:none; border:0; padding:0; font:inherit; color:#60a5fa; text-decoration:underline; cursor:pointer; }
  #train { position:fixed; z-index:100; pointer-events:none; }
  #train i { position:absolute; width:8px; height:8px; }
</style>
</head>
<body>
  <div class="card">
    <h2>Sign In</h2>
    <form onsubmit="event.preventDefault()">
      <div>
        <label for="pw">Password</label>
        <input id="pw" type="password" placeholder="Password" autocomplete="off">
      </div>
      <button class="login" type="submit">Login</button>
    </form>
  </div>

  <div id="game">
    <div class="title" id="title" aria-label="GAME HERE"></div>
    <p class="hint">Press <kbd>ESC</kbd> or <button id="closeBtn">click here</button> to return to login</p>
  </div>

<script>
  const pw = document.getElementById('pw');
  const game = document.getElementById('game');
  const title = document.getElementById('title');
  const S = 8; // pixel size
  let state = 'idle', train = null;

  // Build bouncing letters
  'GAME HERE'.split('').forEach((ch, i) => {
    const s = document.createElement('span');
    s.textContent = ch === ' ' ? '' : ch;
    if (ch === ' ') s.className = 'sp';
    s.style.setProperty('--i', i);
    title.appendChild(s);
  });

  const rnd = (a, b) => a + Math.random() * (b - a);
  const wait = ms => new Promise(r => setTimeout(r, ms));

  function inputColor(r, c, rows, cols) {
    const edge = r === 0 || c === 0 || r === rows - 1 || c === cols - 1;
    const pal = edge ? ['#d1d5db', '#9ca3af', '#2563eb'] : ['#ffffff', '#ffffff', '#f3f4f6'];
    return pal[Math.floor(Math.random() * pal.length)];
  }

  // Train look: roof, windows, body, wheels, split into cars
  function trainColor(r, c, rows, cols) {
    const car = Math.floor(c / 9), cc = c % 9;
    const palette = ['#2563eb', '#ef4444', '#f59e0b', '#10b981'];
    const body = palette[car % palette.length];
    if (cc === 8) return r >= rows - 2 ? 'transparent' : '#334155';      // coupling gap
    if (r === 0) return '#1e293b';                                         // roof
    if (r === 1 || r === 2) return (cc % 3 === 1) ? '#bfdbfe' : body;       // windows
    if (r === 3) return body;
    return (cc === 1 || cc === 2 || cc === 5 || cc === 6) ? '#f8fafc' : 'transparent'; // wheels
  }

  async function launch() {
    if (state !== 'idle') return;
    state = 'busy';
    const rect = pw.getBoundingClientRect();
    const cols = Math.round(rect.width / S), rows = Math.max(5, Math.round(rect.height / S));
    const W = innerWidth, H = innerHeight;

    train = document.createElement('div');
    train.id = 'train';
    train.style.cssText = `left:${rect.left}px;top:${rect.top}px;width:${cols * S}px;height:${rows * S}px`;
    const cells = [];
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const el = document.createElement('i');
      el.style.left = c * S + 'px'; el.style.top = r * S + 'px';
      el.style.background = inputColor(r, c, rows, cols);
      train.appendChild(el); cells.push({ el, r, c });
    }
    document.body.appendChild(train);
    pw.style.visibility = 'hidden';
    pw.blur();

    // 1) Pixelate: flicker the blocks like a glitch
    for (let k = 0; k < 4; k++) {
      cells.forEach(o => { if (Math.random() < .5) o.el.style.background = ['#2563eb', '#93c5fd', '#fff', '#0b1026'][Math.floor(rnd(0, 4))]; });
      await wait(70);
    }

    // 2) Blocks fall to the bottom and land as a train
    const dy = (H - 28 - rows * S) - rect.top;
    const anims = cells.map(o => o.el.animate([
      { transform: 'translate(0,0)' },
      { transform: `translate(${rnd(-12, 12)}px,${dy}px)`, offset: .8 },
      { transform: `translate(0,${dy - rnd(6, 18)}px)`, offset: .9 },
      { transform: `translate(0,${dy}px)` }
    ], { duration: 650, delay: rnd(0, 350) + o.c * 3, easing: 'cubic-bezier(.5,0,.9,.6)', fill: 'forwards' }).finished);
    await Promise.all(anims);
    cells.forEach(o => { o.el.style.background = trainColor(o.r, o.c, rows, cols); });
    await wait(150);

    // 3) Train chugs off screen while the game screen rises from the bottom
    game.classList.add('on');
    game.animate([{ clipPath: 'inset(100% 0 0 0)' }, { clipPath: 'inset(0 0 0 0)' }],
      { duration: 1100, delay: 150, easing: 'cubic-bezier(.22,1,.36,1)', fill: 'forwards' });
    train.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-14px)', offset: .12 }, { transform: `translateX(${W - rect.left + 40}px)` }],
      { duration: 1500, easing: 'cubic-bezier(.6,0,.9,.5)', fill: 'forwards' });
    cells.forEach(o => { if (o.r === rows - 1 || o.r === rows - 2) o.el.animate([{ marginTop: '0px' }, { marginTop: '-2px' }, { marginTop: '0px' }], { duration: 160, iterations: 10 }); });

    await wait(800);
    game.classList.add('show');
    title.classList.add('go');
    await wait(800);
    train.remove(); train = null;
    state = 'game';
  }

  async function close() {
    if (state !== 'game') return;
    state = 'busy';
    await game.animate([{ clipPath: 'inset(0 0 0 0)' }, { clipPath: 'inset(100% 0 0 0)' }],
      { duration: 600, easing: 'cubic-bezier(.22,1,.36,1)', fill: 'forwards' }).finished;
    game.classList.remove('on', 'show');
    title.classList.remove('go');
    game.getAnimations().forEach(a => a.cancel());
    pw.style.visibility = '';
    pw.blur();
    state = 'idle';
  }

  pw.addEventListener('focus', launch);
  addEventListener('keydown', e => { if (e.key === 'Escape' && state === 'game') { e.preventDefault(); close(); } });
  document.getElementById('closeBtn').addEventListener('click', close);
</script>
</body>
</html>
